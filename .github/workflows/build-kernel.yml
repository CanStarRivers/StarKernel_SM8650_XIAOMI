# .github/workflows/build-kernel.yml
name: Build StarKernel

on:
  workflow_dispatch:
  push:
    branches:
      - android14-6.1.162-20260506

jobs:
  build:
    name: Build Kernel (arm64 / android14-6.1)
    runs-on: ubuntu-22.04

    steps:
      # ──────────────────────────────────────────────
      # 1. 释放磁盘空间
      # ──────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift
          df -h

      # ──────────────────────────────────────────────
      # 2. Checkout 内核源码
      # ──────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ──────────────────────────────────────────────
      # 3. 安装编译依赖
      # ──────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio \
            curl flex git kmod libelf-dev libssl-dev \
            lz4 make pahole python3 rsync wget zip zstd

      # ──────────────────────────────────────────────
      # 4. 获取 AOSP Clang r487747c
      #
      #    方案：git sparse-checkout（无需认证）
      #    r487747c = android14-6.1 官方工具链 (Clang 17.0.x)
      #
      #    如果 googlesource 网络不稳，可切换到下面注释掉的
      #    LLVM apt 备选方案
      # ──────────────────────────────────────────────
      - name: Setup AOSP Clang r487747c (sparse-checkout)
        run: |
          CLANG_VER="r487747c"
          CLANG_REPO="$HOME/clang-prebuilts"

          git clone \
            --filter=blob:none \
            --sparse \
            --depth 1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${CLANG_REPO}"

          cd "${CLANG_REPO}"
          # 只拉取 clang-r487747c 子目录的 blob，其余不下载
          git sparse-checkout set "clang-${CLANG_VER}"

          CLANG_BIN="${CLANG_REPO}/clang-${CLANG_VER}/bin"
          echo "${CLANG_BIN}" >> "$GITHUB_PATH"
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"

          "${CLANG_BIN}/clang" --version | head -1

      # ──────────────────────────────────────────────
      # [备选] 若上面步骤失败，启用此步替换
      # 取消注释后，把上面 sparse-checkout 步骤的 run: 整体注释掉
      # ──────────────────────────────────────────────
      # - name: Setup Clang 17 from LLVM APT (fallback)
      #   run: |
      #     wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
      #       | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
      #     echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] \
      #       https://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" \
      #       | sudo tee /etc/apt/sources.list.d/llvm-17.list
      #     sudo apt-get update -qq
      #     sudo apt-get install -y --no-install-recommends \
      #       clang-17 lld-17 llvm-17
      #     CLANG_BIN="/usr/lib/llvm-17/bin"
      #     echo "${CLANG_BIN}" >> "$GITHUB_PATH"
      #     echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
      #     "${CLANG_BIN}/clang" --version | head -1

      # ──────────────────────────────────────────────
      # 5. 生成 .config
      # ──────────────────────────────────────────────
      - name: Configure kernel (gki_defconfig)
        run: |
          make O=out \
               ARCH=arm64 \
               LLVM="${CLANG_BIN}/" \
               LLVM_IAS=1 \
               -j$(nproc) \
               gki_defconfig

      # ──────────────────────────────────────────────
      # 6. 编译
      # ──────────────────────────────────────────────
      - name: Build kernel
        run: |
          make O=out \
               ARCH=arm64 \
               LLVM="${CLANG_BIN}/" \
               LLVM_IAS=1 \
               -j$(nproc)

      # ──────────────────────────────────────────────
      # 7. 收集产物
      # ──────────────────────────────────────────────
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/
          [ -f out/arch/arm64/boot/Image.lz4 ] && \
            cp out/arch/arm64/boot/Image.lz4 artifacts/ || true
          ls -lh artifacts/

      # ──────────────────────────────────────────────
      # 8. 上传 Image
      # ──────────────────────────────────────────────
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: StarKernel-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/
          retention-days: 7
