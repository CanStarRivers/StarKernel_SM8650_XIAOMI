name: Build StarKernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel (arm64 / android14-6.1)
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate version string
        id: version
        run: |
          export TZ='Asia/Shanghai'
          YEAR=$(date +%y)
          WEEK=$(date +%-U)
          case $(date +%w) in
            0) D="s" ;;
            1) D="m" ;;
            2) D="t" ;;
            3) D="w" ;;
            4) D="t" ;;
            5) D="f" ;;
            6) D="s" ;;
          esac
          STAMP="${YEAR}w${WEEK}${D}"
          FULL="6.1.162-android14-StarKernel-${STAMP}"
          echo "STAMP=${STAMP}" >> "$GITHUB_OUTPUT"
          echo "FULL=${FULL}"   >> "$GITHUB_OUTPUT"
          echo "Generated: ${FULL}"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio \
            curl flex git kmod libelf-dev libssl-dev \
            lz4 make pahole python3 rsync wget zip zstd

      - name: Install Clang 17 toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] \
            https://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-17 lld-17 llvm-17
          /usr/lib/llvm-17/bin/clang --version
          /usr/lib/llvm-17/bin/ld.lld --version

      - name: Configure kernel (gki_defconfig)
        run: |
          make O=out \
               ARCH=arm64 \
               LLVM=/usr/lib/llvm-17/bin/ \
               LLVM_IAS=1 \
               LOCALVERSION="-android14-StarKernel-${{ steps.version.outputs.STAMP }}" \
               -j$(nproc) \
               gki_defconfig

      - name: Build kernel
        run: |
          make O=out \
               ARCH=arm64 \
               LLVM=/usr/lib/llvm-17/bin/ \
               LLVM_IAS=1 \
               LOCALVERSION="-android14-StarKernel-${{ steps.version.outputs.STAMP }}" \
               -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/
          [ -f out/arch/arm64/boot/Image.lz4 ] && \
            cp out/arch/arm64/boot/Image.lz4 artifacts/ || true
          ls -lh artifacts/

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.FULL }}
          path: artifacts/
          retention-days: 7
